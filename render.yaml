services:
  - type: web
    name: cat-smart-operator
    runtime: node
    buildCommand: pip install -r requirements.txt && python3 model/generate_data.py && python3 model/predictor.py train && cd server && npm install && cd ..
    startCommand: node server/src/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_PATH
        value: python3
      - key: NODE_ENV
        value: production
    plan: free
